{{- with .Values.kthenaRouter.tokenizerService }}
{{- if and .enabled (eq .mode "standalone") .standalone.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kthena-tokenizer
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: kthena-tokenizer
    {{- include "kthena.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kthena-tokenizer
  minReplicas: {{ .standalone.autoscaling.minReplicas }}
  maxReplicas: {{ .standalone.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .standalone.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
