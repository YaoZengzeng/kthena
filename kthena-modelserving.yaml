apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kthena-controller-manager-mutating-webhook
  labels:
    app.kubernetes.io/component: webhook
    helm.sh/chart: workload-1.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: kthena
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
webhooks:
  - name: mutate-modelbooster.volcano.sh
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 30
    clientConfig:
      service:
        name: kthena-controller-manager-webhook
        namespace: default
        path: "/mutate/modelbooster"
        port: 443
    rules:
      - apiGroups: [ "workload.serving.volcano.sh" ]
        apiVersions: [ "v1alpha1" ]
        resources: [ "modelboosters" ]
        operations: [ "CREATE", "UPDATE" ]
        scope: "Namespaced"
    # This ensures the webhook is called before validation
    reinvocationPolicy: IfNeeded
  - name: mutate-autoscalingpolicy.volcano.sh
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 30
    clientConfig:
      service:
        name: kthena-controller-manager-webhook
        namespace: default
        path: "/mutate/autoscalingpolicy"
        port: 443
    rules:
      - apiGroups: [ "workload.serving.volcano.sh" ]
        apiVersions: [ "v1alpha1" ]
        resources: [ "autoscalingpolicies" ]
        operations: [ "CREATE", "UPDATE" ]
        scope: "Namespaced"
    # This ensures the webhook is called before validation
    reinvocationPolicy: IfNeeded
