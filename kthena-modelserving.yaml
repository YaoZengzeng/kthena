# Source: kthena/charts/workload/templates/kthena-controller-manager/component/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kthena-controller-manager
  namespace: default
  labels:
    app.kubernetes.io/component: kthena-controller-manager
    helm.sh/chart: workload-1.0.0
    app.kubernetes.io/name: workload
    app.kubernetes.io/instance: kthena
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kthena-controller-manager
      app.kubernetes.io/name: workload
      app.kubernetes.io/instance: kthena
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kthena-controller-manager
        helm.sh/chart: workload-1.0.0
        app.kubernetes.io/name: workload
        app.kubernetes.io/instance: kthena
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: kthena-controller-manager
          image: "ghcr.io/volcano-sh/kthena-controller-manager:latest"
          args:
            - --v=2
            - --cert-secret-name=kthena-controller-manager-webhook-certs
            - --service-name=kthena-controller-manager-webhook
            - "--controllers=modelserving"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - containerPort: 8443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: webhook-certs
          secret:
            secretName: kthena-controller-manager-webhook-certs
            optional: true
      serviceAccountName: kthena-controller-manager
---
